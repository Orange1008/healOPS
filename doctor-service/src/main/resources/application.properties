server.port=4002
spring.application.name=doctor-service

# In-memory H2 Database for seamless standalone/Docker execution
spring.datasource.url=jdbc:h2:mem:doctordb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Spring Boot Actuator for HealOps Closed-Loop Monitoring
management.endpoints.web.exposure.include=health,metrics,info,env
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
