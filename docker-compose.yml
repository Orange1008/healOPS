services:
  kafka:
    image: apache/kafka:latest
    pull_policy: never
    profiles: ["messaging"]
    mem_limit: 512m
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    init: true
    mem_limit: 384m
    ports: ["8080:8080"]
    depends_on:
      auth-service: { condition: service_healthy }
      patient-service: { condition: service_healthy }
      clinical-service: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 30s
      retries: 3
      start_period: 10m

  healops-core:
    build: ./healops-core
    container_name: healops-core
    init: true
    mem_limit: 512m
    ports: ["8090:8090"]
    environment:
      DOCKER_CONTAINER: "true"
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/healopsdb;DB_CLOSE_ON_EXIT=FALSE
      SPRING_DATASOURCE_HIKARI_LEAKDETECTIONTHRESHOLD: "30000"
      HEALOPS_DOCKER_HOST: http://healops-docker-control
      HEALOPS_ENABLED_OPTIONAL_SERVICES: ${HEALOPS_ENABLED_OPTIONAL_SERVICES:-}
    depends_on:
      api-gateway: { condition: service_healthy }
      healops-docker-control: { condition: service_healthy }
    volumes:
      - healops-data:/data
    networks:
      - default
      - healops-control
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/actuator/health || exit 1"]
      interval: 20s
      timeout: 30s
      retries: 3
      start_period: 10m

  # Exposes only allowlisted container restart operations to HealOps Core.
  # Docker Engine's full API socket is never exposed on a TCP port or to the UI.
  healops-docker-control:
    image: major-project1-healops-dashboard:latest
    container_name: healops-docker-control
    mem_limit: 32m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./infrastructure/healops/docker-nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/healops/docker-control.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - healops-control
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/__docker-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  patient-service:
    build: ./patient-service
    container_name: patient-service
    init: true
    mem_limit: 384m
    environment:
      BILLING_SERVICE_ADDRESS: billing-service
      BILLING_SERVICE_GRPC_PORT: 9001
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - patient-data:/tmp
    restart: unless-stopped
    healthcheck: &spring-health
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/actuator/health || exit 1"]
      interval: 20s
      timeout: 30s
      retries: 3
      start_period: 10m

  clinical-service:
    build: ./clinical-service
    container_name: clinical-service
    init: true
    mem_limit: 512m
    ports: ["4002:4002"]
    volumes:
      - clinical-data:/tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4002/actuator/health || exit 1"]
      interval: 20s
      timeout: 30s
      retries: 3
      start_period: 10m

  billing-service:
    build: ./billing-service
    container_name: billing-service
    profiles: ["billing"]
    init: true
    mem_limit: 384m
    ports: ["4001:4001", "9001:9001"]
    restart: unless-stopped
    healthcheck:
      <<: *spring-health
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4001/actuator/health || exit 1"]

  auth-service:
    build: ./auth-service
    container_name: auth-service
    init: true
    mem_limit: 384m
    ports: ["4005:4005"]
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the project .env file}
    restart: unless-stopped
    healthcheck:
      <<: *spring-health
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4005/actuator/health || exit 1"]

  notification-service:
    build: ./notification-service
    container_name: notification-service
    profiles: ["extended"]
    init: true
    mem_limit: 384m
    ports: ["4008:4008"]
    restart: unless-stopped
    healthcheck:
      <<: *spring-health
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4008/actuator/health || exit 1"]

  mediflow-web:
    build: ./mediflow-web
    mem_limit: 128m
    ports: ["3001:80"]
    depends_on:
      api-gateway: { condition: service_healthy }
      healops-core: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  healops-dashboard:
    build: ./healops-dashboard
    mem_limit: 128m
    ports: ["8091:80"]
    depends_on:
      healops-core: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  healops-data:
  patient-data:
  clinical-data:

networks:
  healops-control:
    internal: true
