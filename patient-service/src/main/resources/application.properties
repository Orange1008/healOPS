spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
# Kafka is optional in the default Compose profile; don't let missing broker metadata
# occupy integration workers for the Kafka default 60-second max.block.ms.
spring.kafka.producer.properties.max.block.ms=250

server.port=4000
logging.level.root=info

# Spring Boot Actuator Configuration for HealOps Monitoring
management.endpoints.web.exposure.include=health,metrics,info,env
management.endpoint.health.show-details=always
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Keep patient registrations across container restarts. Compose mounts /tmp as
# a named volume for this service, and H2 stores its files there.
spring.datasource.url=jdbc:h2:file:/tmp/patientdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

