server.port=8090
spring.application.name=healops-core

# Database Configuration (Defaults to embedded H2 for instant runs, configurable to PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:healopsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Docker Engine Host (Defaults to Windows Docker pipe or tcp)
healops.docker.host=tcp://localhost:2375
healops.monitoring.poll-interval-ms=5000
healops.detection.cpu-threshold-percent=90
healops.detection.heap-threshold-ratio=0.85
healops.detection.slow-response-ms=2000
healops.detection.sliding-window-size=3
healops.detection.zscore-threshold=2.5
healops.metrics.retention-hours=24

# Actuator
management.endpoints.web.exposure.include=health,metrics,info
