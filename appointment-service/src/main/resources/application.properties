server.port=4003
spring.application.name=appointment-service

# Standalone in-memory database
spring.datasource.url=jdbc:h2:mem:appointmentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Actuator monitoring endpoints for HealOps
management.endpoints.web.exposure.include=health,metrics,info,env
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
