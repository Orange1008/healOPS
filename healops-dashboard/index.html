<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HealOps - Autonomous Self-Healing Microservices Platform</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gamma: {
                dark: '#08090D',
                card: 'rgba(18, 20, 29, 0.7)',
                cardBorder: 'rgba(255, 255, 255, 0.08)',
                accent: '#8b5cf6',
                cyan: '#06b6d4',
                emerald: '#10b981',
                rose: '#f43f5e'
              }
            },
            boxShadow: {
              'glow-violet': '0 0 25px -5px rgba(139, 92, 246, 0.3)',
              'glow-teal': '0 0 25px -5px rgba(20, 184, 166, 0.3)',
              'glow-rose': '0 0 25px -5px rgba(244, 63, 94, 0.3)',
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #08090D;
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
      .gamma-glass {
        background: rgba(18, 20, 29, 0.7);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .gamma-glow {
        box-shadow: 0 0 30px -5px rgba(139, 92, 246, 0.25);
      }
    </style>
  </head>
  <body class="bg-[#08090D] text-slate-100 antialiased selection:bg-purple-500/30 selection:text-purple-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
