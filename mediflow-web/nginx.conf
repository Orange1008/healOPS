server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $api_gateway api-gateway;
    proxy_pass http://$api_gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /auth/ {
    set $api_gateway api-gateway;
    proxy_pass http://$api_gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /healops/ {
    # Resolve HealOps Core when a request arrives so this web container can
    # still start while Core is unavailable or restarting.
    set $healops_core healops-core;
    rewrite ^/healops/(.*)$ /$1 break;
    proxy_pass http://$healops_core:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  location / { try_files $uri $uri/ /index.html; }
}
