upstream docker_engine {
    server unix:/var/run/docker.sock;
}

server {
    listen 80;
    server_name _;
    proxy_connect_timeout 5s;
    proxy_send_timeout 130s;
    proxy_read_timeout 130s;

    location = /__health {
        access_log off;
        return 200 "ok\n";
    }

    # Health check only: no container metadata or other Engine API is exposed.
    location = /__docker-health {
        limit_except GET { deny all; }
        access_log off;
        proxy_http_version 1.1;
        proxy_set_header Host docker;
        proxy_set_header Connection "";
        proxy_pass http://docker_engine/_ping;
    }

    location = /restart/patient-service {
        limit_except POST { deny all; }
        proxy_http_version 1.1;
        proxy_set_header Host docker;
        proxy_set_header Connection "";
        proxy_pass http://docker_engine/containers/patient-service/restart?t=30;
    }

    location = /start/patient-service {
        limit_except POST { deny all; }
        proxy_http_version 1.1;
        proxy_set_header Host docker;
        proxy_set_header Connection "";
        proxy_pass http://docker_engine/containers/patient-service/start;
    }

    location = /restart/clinical-service {
        limit_except POST { deny all; }
        proxy_http_version 1.1;
        proxy_set_header Host docker;
        proxy_set_header Connection "";
        proxy_pass http://docker_engine/containers/clinical-service/restart?t=30;
    }

    location = /start/clinical-service {
        limit_except POST { deny all; }
        proxy_http_version 1.1;
        proxy_set_header Host docker;
        proxy_set_header Connection "";
        proxy_pass http://docker_engine/containers/clinical-service/start;
    }

    location = /restart/auth-service {
        limit_except POST { deny all; }
        proxy_http_version 1.1;
        proxy_set_header Host docker;
        proxy_set_header Connection "";
        proxy_pass http://docker_engine/containers/auth-service/restart?t=30;
    }

    location = /start/auth-service {
        limit_except POST { deny all; }
        proxy_http_version 1.1;
        proxy_set_header Host docker;
        proxy_set_header Connection "";
        proxy_pass http://docker_engine/containers/auth-service/start;
    }

    location = /restart/api-gateway {
        limit_except POST { deny all; }
        proxy_http_version 1.1;
        proxy_set_header Host docker;
        proxy_set_header Connection "";
        proxy_pass http://docker_engine/containers/api-gateway/restart?t=30;
    }

    location = /start/api-gateway {
        limit_except POST { deny all; }
        proxy_http_version 1.1;
        proxy_set_header Host docker;
        proxy_set_header Connection "";
        proxy_pass http://docker_engine/containers/api-gateway/start;
    }

    location / {
        return 404;
    }
}
