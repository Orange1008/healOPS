server:
  port: 8080

auth:
  service:
    url: ${AUTH_SERVICE_URL:http://auth-service:4005}

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,metrics,info

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service-route
          uri: http://auth-service:4005
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
        - id: patient-service-route
          uri: http://patient-service:4000
          predicates:
            - Path=/api/patients/**
          filters:
            - StripPrefix=1
            - JwtValidation
        - id: doctor-service-route
          uri: http://clinical-service:4002
          predicates:
            - Path=/api/doctors/**
        - id: appointment-service-route
          uri: http://clinical-service:4002
          predicates:
            - Path=/api/appointments/**
        - id: clinical-laboratory-route
          uri: http://clinical-service:4002
          predicates:
            - Path=/api/laboratory/**
        - id: clinical-pharmacy-route
          uri: http://clinical-service:4002
          predicates:
            - Path=/api/pharmacy/**
        - id: clinical-inventory-route
          uri: http://clinical-service:4002
          predicates:
            - Path=/api/inventory/**
        - id: notification-service-route
          uri: http://notification-service:4008
          predicates:
            - Path=/api/notifications/**
        - id: api-docs-patient-route
          uri: http://patient-service:4000
          predicates:
            - Path=/api-docs/patients
          filters:
            - RewritePath=/api-docs/patients,/v3/api-docs
        - id: api-docs-auth-route
          uri: http://auth-service:4005
          predicates:
            - Path=/api-docs/auth
          filters:
            - RewritePath=/api-docs/auth,/v3/api-docs
